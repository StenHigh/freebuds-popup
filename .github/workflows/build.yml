name: build

on:
  push:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - run: echo "sdk.dir=$ANDROID_HOME" > local.properties && ls $ANDROID_HOME/platforms
      - run: gradle testDebugUnitTest assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: BudsPopup-android
          path: android/app/build/outputs/apk/release/*.apk

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: protocol tests
        run: cd macos && mkdir -p build && swiftc Sources/HuaweiSpp.swift Tests/main.swift -o build/tests && ./build/tests
      - run: ARCH=universal ./macos/build.sh
      - run: cd macos/build && ditto -c -k --keepParent BudsPopup.app BudsPopup-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: BudsPopup-macos
          path: macos/build/BudsPopup-macos.zip

  release:
    needs: [android, macos]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: |
          cd dist
          mv *.apk BudsPopup.apk
          ls -la
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Buds Popup (сборка ${{ github.run_number }})
          make_latest: true
          body: |
            Автосборка из коммита ${{ github.sha }}.
            - **BudsPopup.apk** — Android (Xiaomi / HyperOS), Android 12+
            - **BudsPopup-macos.zip** — macOS 13+, распаковать и перенести в /Applications
          files: |
            dist/BudsPopup.apk
            dist/BudsPopup-macos.zip
