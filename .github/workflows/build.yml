name: build

on:
  push:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - run: gradle testDebugUnitTest assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: BudsPopup-android
          path: android/app/build/outputs/apk/release/*.apk

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: protocol tests
        run: cd macos && mkdir -p build && swiftc Sources/HuaweiSpp.swift Tests/main.swift -o build/tests && ./build/tests
      - run: ARCH=universal ./macos/build.sh
      - run: cd macos/build && ditto -c -k --keepParent BudsPopup.app BudsPopup-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: BudsPopup-macos
          path: macos/build/BudsPopup-macos.zip
